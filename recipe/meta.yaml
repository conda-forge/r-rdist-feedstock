{% set version = "0.0.6" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-rdist
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/rdist_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/rdist/rdist_{{ version }}.tar.gz
  sha256: a9a440ecd2ed6605ff7d20e5b5b2d24ecb818e43dabdbe3aa86da459a9a13fb5

build:
  number: 0
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  build:
    - {{ compiler('c') }}          # [not win]
    - {{ stdlib("c") }}            # [not win]
    - {{ compiler('m2w64_c') }}    # [win]
    - {{ stdlib("m2w64_c") }}      # [win]
    - {{ compiler('cxx') }}        # [not win]
    - {{ compiler('m2w64_cxx') }}  # [win]
    - {{ posix }}filesystem        # [win]
    - {{ posix }}make
    - {{ posix }}sed               # [win]
    - {{ posix }}coreutils         # [win]
    - {{ posix }}zip               # [win]
  host:
    - libblas
    - libgomp                      # [linux]
    - llvm-openmp                  # [osx]
    - r-base
    - r-rcpp
    - r-rcpparmadillo
  run:
    - r-base
    - r-rcpp
    - r-rcpparmadillo

test:
  commands:
    - $R -e "library('rdist')"           # [not win]
    - "\"%R%\" -e \"library('rdist')\""  # [win]

about:
  home: https://github.com/blasern/rdist
  license: GPL-2.0-or-later
  summary: A common framework for calculating distance matrices.
  license_family: GPL3
  license_file:
    - {{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-2
    - {{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-3

extra:
  recipe-maintainers:
    - conda-forge/r
